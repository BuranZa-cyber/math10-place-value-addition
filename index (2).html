<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>246000 + 185000</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#18213a;background:#fff;--violet:#7759db;--blue:#348cde;--orange:#f0a54d;--cell:clamp(31px,7.6vw,66px)}
*{box-sizing:border-box}
body{margin:0;background:#fff;padding:12px}
.wrap{max-width:750px;margin:0 auto;border:1px solid #e4e7f0;border-radius:18px;padding:clamp(12px,3.5vw,26px);box-shadow:0 5px 24px #17265508}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.problem{font-size:clamp(19px,4.1vw,29px);font-weight:800;letter-spacing:.4px;white-space:nowrap}
.reset{width:38px;height:38px;border-radius:12px;background:#f1f3f9;border:1px solid #e1e4ed;font-size:23px;cursor:pointer;color:#33415c}
.stage{border-radius:16px;background:#f8faff;padding:clamp(13px,3vw,26px) clamp(5px,1.6vw,14px);margin-bottom:14px}
.equation{min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(23px,5vw,32px);font-weight:800;margin-bottom:13px;letter-spacing:.2px}
.equation span:first-child{background:#edf1fa;border-radius:12px;padding:5px 12px}
.eqresult{border-radius:10px;background:#e7f8ed;color:#187848;min-width:48px;text-align:center;padding:5px 8px}
.grid{display:grid;grid-template-columns:clamp(21px,5vw,42px) repeat(6,minmax(0,1fr));gap:clamp(3px,.9vw,9px);max-width:548px;margin:0 auto;align-items:center}
.carry{height:27px;font-size:clamp(15px,2.8vw,22px);font-weight:800;color:#b45403;text-align:center;line-height:26px}
.cell{min-height:var(--cell);display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:clamp(25px,5vw,39px);font-weight:750;font-variant-numeric:tabular-nums;transition:background-color .15s,border-color .15s,transform .12s;letter-spacing:0}
.cell.a{background:#eae4ff;color:#5038a5}
.cell.b{background:#e1f1ff;color:#245eaa}
.cell.c{background:#ffedd1;color:#8c4f07}
.cell.zero{background:#f0f2f6;color:#9199a9}
.cell.sum{background:#fff;border:2px dashed #c7cedc;color:#374156}
.cell.sum.filled{background:#e4f7ee;border:2px solid #5cc18d;color:#146c43}
.cell.sum.active{background:#fffde8;border:3px solid #f3b342;box-shadow:0 0 0 4px #ffc75b27;animation:breathe 1.1s ease-in-out infinite alternate}
@keyframes breathe{from{box-shadow:0 0 0 1px #ffc75b25}to{box-shadow:0 0 0 6px #ffc75b35}}
.cell.sum.wrong{background:#fff0f0!important;border-color:#ee5367!important;animation:shake .24s linear 1}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}100%{transform:translateX(0)}}
.cell.focus.a{outline:3px solid #987ce9;outline-offset:0}
.cell.focus.b{outline:3px solid #54a8fa;outline-offset:0}
.cell.focus.c{outline:3px solid #e8a349;outline-offset:0}
.symbol{font-size:clamp(20px,5vw,34px);font-weight:850;text-align:center;line-height:1}
.separator{grid-column:1/-1;border-top:3px solid #485476;height:0;margin:1px 0 4px 0}
.bank{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;max-width:680px;margin:0 auto}
.digit{font:800 clamp(22px,4.2vw,32px) Arial,sans-serif;color:#152238;border-radius:12px;min-height:56px;border:2px solid #dae0eb;background:#fff;box-shadow:0 3px 0 #dfe5ee;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;transition:transform .1s,border-color .12s}
.digit:active{cursor:grabbing;transform:translateY(2px)}.digit:focus-visible{outline:3px solid #3794f7;outline-offset:2px}
.digit.candidate{border-color:#f6b84d;background:#fff8df}
.hintline{height:20px;margin-top:10px;display:flex;justify-content:center;gap:5px;align-items:center}
.pip{height:7px;width:22px;border-radius:20px;background:#dde2ee}.pip.on{background:#faaf43}.pip.done{background:#52c887}
.completion{font-size:clamp(20px,4.5vw,29px);font-weight:800;text-align:center;min-height:36px;color:#167447;display:flex;align-items:center;justify-content:center}
.completion.hidden{visibility:hidden}
@media(max-width:560px){body{padding:5px}.wrap{border:0;box-shadow:none;padding:7px}.head{margin-bottom:6px}.stage{margin-bottom:10px}.bank{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.digit{min-height:45px}.cell{border-radius:7px}.grid{gap:4px}.symbol{font-size:20px}.carry{height:22px;line-height:19px}.equation{margin-bottom:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <div class="problem">246 000 + 185 000</div>
    <button type="button" class="reset" id="reset" aria-label="Reset" title="↺">↺</button>
  </div>
  <div class="stage">
    <div class="equation" aria-live="polite" id="expression"><span>6 + 5</span> = <span>?</span></div>
    <div class="grid" id="grid" aria-label="Column arithmetic">
      <span></span><div id="carry5" class="carry"></div><div id="carry4" class="carry"></div><div id="carry3" class="carry"></div><div class="carry"></div><div class="carry"></div><div class="carry"></div>
      <div class="symbol"></div>
      <div class="cell a">2</div><div class="cell b">4</div><div class="cell c">6</div><div class="cell zero">0</div><div class="cell zero">0</div><div class="cell zero">0</div>
      <div class="symbol">+</div>
      <div class="cell a">1</div><div class="cell b">8</div><div class="cell c">5</div><div class="cell zero">0</div><div class="cell zero">0</div><div class="cell zero">0</div>
      <div class="separator"></div>
      <div class="symbol">=</div>
      <div id="ans5" class="cell sum"></div><div id="ans4" class="cell sum"></div><div id="ans3" class="cell sum"></div><div class="cell zero">0</div><div class="cell zero">0</div><div class="cell zero">0</div>
    </div>
  </div>
  <div class="bank" id="bank" aria-label="0–9"></div>
  <div class="hintline" aria-hidden="true"><div id="pip0" class="pip"></div><div id="pip1" class="pip"></div><div id="pip2" class="pip"></div></div>
  <div class="completion hidden" id="complete" aria-live="polite">✓ 431 000</div>
</main>
<script>
(()=>{
  'use strict';
  const steps=[{col:3,digit:1,terms:'6 + 5',carryTo:4,full:11},
               {col:4,digit:3,terms:'4 + 8 + 1',carryTo:5,full:13},
               {col:5,digit:4,terms:'2 + 1 + 1',carryTo:null,full:4}];
  let step=0;
  let isDragging=false,lastDrop=0;
  const expr=document.getElementById('expression');
  const bank=document.getElementById('bank');
  const done=document.getElementById('complete');
  function activeCell(){return document.getElementById('ans'+steps[step].col)}
  function update(){
    for (const col of [3,4,5]) document.getElementById('ans'+col).classList.remove('active');
    document.querySelectorAll('.cell.focus').forEach(x=>x.classList.remove('focus'));
    for(let i=0;i<3;i++) document.getElementById('pip'+i).className='pip'+(i<step?' done':i===step?' on':'');
    if(step>=steps.length){
      expr.innerHTML='<span>246 000 + 185 000</span> = <span class="eqresult">431 000</span>';
      done.classList.remove('hidden');
      document.querySelectorAll('.digit').forEach(x=>x.setAttribute('aria-disabled','true'));
      return;
    }
    const s=steps[step];
    expr.innerHTML=`<span>${s.terms}</span> = <span>?</span>`;
    activeCell().classList.add('active');
    const rows=Array.from(document.querySelectorAll('.grid > .cell'));
    // Align the two operand cells in the active column for visual guidance.
    const pos=5-s.col;
    rows[pos].classList.add('focus');
    rows[6+pos].classList.add('focus');
    done.classList.add('hidden');
  }
  function place(digit){
    if(step>=steps.length)return;
    const s=steps[step],target=activeCell();
    if(digit!==s.digit){
      target.classList.remove('wrong');void target.offsetWidth;target.classList.add('wrong');
      setTimeout(()=>target.classList.remove('wrong'),340);
      return;
    }
    target.textContent=String(digit);
    target.classList.add('filled');
    target.classList.remove('active');
    if(s.carryTo!=null){document.getElementById('carry'+s.carryTo).textContent='¹'}
    step++;
    update();
  }
  for(let n=0;n<=9;n++){
    const el=document.createElement('button');el.type='button';el.className='digit';el.textContent=String(n);el.draggable=true;el.setAttribute('aria-label',String(n));
    el.addEventListener('click',()=>{if(Date.now()-lastDrop>350)place(n)});
    el.addEventListener('dragstart',e=>{isDragging=true;e.dataTransfer.setData('text/plain',String(n));e.dataTransfer.effectAllowed='copy'});
    el.addEventListener('dragend',()=>{isDragging=false});
    let touchStart=null;
    el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')touchStart={x:e.clientX,y:e.clientY}});
    el.addEventListener('pointerup',e=>{
      if(!touchStart||e.pointerType==='mouse')return;
      const d=Math.hypot(e.clientX-touchStart.x,e.clientY-touchStart.y);
      if(d>14){const target=document.elementFromPoint(e.clientX,e.clientY);if(target && target.closest('#ans'+(step<3?steps[step].col:'none'))){place(n);lastDrop=Date.now()}}
      touchStart=null;
    });
    bank.append(el);
  }
  for(let col of [3,4,5]){
    const el=document.getElementById('ans'+col);
    el.addEventListener('dragover',e=>{if(step<steps.length&&steps[step].col===col){e.preventDefault();e.dataTransfer.dropEffect='copy'}});
    el.addEventListener('drop',e=>{e.preventDefault();if(step<steps.length&&steps[step].col===col){place(Number(e.dataTransfer.getData('text/plain')));lastDrop=Date.now()}});
  }
  document.getElementById('reset').addEventListener('click',()=>{
    step=0;
    for(let col of [3,4,5]){const el=document.getElementById('ans'+col);el.textContent='';el.className='cell sum';}
    for(let col of [4,5])document.getElementById('carry'+col).textContent='';
    document.querySelectorAll('.digit').forEach(x=>x.removeAttribute('aria-disabled'));
    update();
  });
  update();
})();
</script>
</body>
</html>
